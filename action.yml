name: 'GitHub Actions Slack Notify'
description: 'Send notifications to Slack'
author: 'Duc Duong <duc.duong@c0x12c.com>'

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: 'heart'
  color: 'red'

# Define your inputs here.
inputs:
  buttons:
    description: >-
      Extra buttons, as a JSON array of {"text", "url"} objects, rendered after the built-in View
      Commit and View Pipeline ones. An entry missing either field is skipped rather than failing
      the notification.
    required: false
    default: ''
  channel:
    description: >-
      Channel ID to post to with `slack_bot_token`. Required with it, and the bot must be a member.
    required: false
    default: ''
  errors_reply_as_thread:
    description: >-
      "true" posts the `include_errors` section as a thread reply instead of in the message. Needs
      `slack_bot_token` and `channel`, since a webhook cannot reply in a thread; without them the
      section stays inline.
    required: false
    default: 'false'
  github_token:
    description: "Token used to read the run's failed jobs and their error annotations."
    required: false
    default: ${{ github.token }}
  include_errors:
    description: >-
      "true" adds the first failed job's steps and its first error annotation, with a hint for known
      errors such as an AWS OIDC role the run could not assume. Needs `actions: read` and `checks:
      read`.
    required: false
    default: 'false'
  message:
    description: 'Optional body text rendered beneath the title.'
    required: false
    default: ''
  message_format:
    description: >-
      How to render `message`: "mrkdwn" (default) passes it through, "code" wraps it in a code block
      and escapes any fence terminator in the body so it cannot close the block early.
    required: false
    default: 'mrkdwn'
  num-commits:
    description: 'The number of recent commits included in the message'
    required: false
    default: '3'
  project_url:
    description: 'The project URL for preview'
    required: false
  slack_bot_token:
    description: >-
      Bot token (`chat:write`) to post with chat.postMessage instead of `webhook_url`. Used when
      both it and `channel` are set.
    required: false
    default: ''
  title:
    description: 'The message title'
    required: true
  webhook_url:
    description: 'The Slack webhook URL. Required unless `slack_bot_token` and `channel` are set.'
    required: false
    default: ''

runs:
  using: node24
  main: dist/index.js
